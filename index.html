  <!-- Pi SDK - Must be included in HTML as per Pi documentation -->
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <script>
    // Initialize Pi SDK immediately as per Pi documentation
    if (window.Pi) {
      // Check if we're in development (sandbox) or production
      const isDevelopment = window.location.hostname === 'localhost' || window.location.hostname.includes('127.0.0.1') || window.location.hostname.includes('ngrok') || window.location.hostname.includes('localtunnel');
      
      window.Pi.init({ 
        version: "2.0", 
        sandbox: isDevelopment 
      });
      
      console.log('Pi SDK initialized in', isDevelopment ? 'sandbox' : 'production', 'mode');
    } else {
      console.warn('Pi SDK not available - ensure you are using Pi Browser');
    }
  </script>
